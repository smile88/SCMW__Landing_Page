<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" fill="none">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0E4B3C" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#C9A961" fill-opacity="0.3"/>
    </pattern>
    <linearGradient id="cardBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F7F5"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E4B3C" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="800" height="480" rx="12" fill="#F6F7F5"/>
  <rect width="800" height="480" rx="12" fill="url(#grid)"/>

  <!-- Outer Blueprint Border -->
  <rect x="20" y="20" width="760" height="440" rx="8" stroke="#0E4B3C" stroke-opacity="0.2" stroke-width="1" fill="none"/>
  <rect x="28" y="28" width="744" height="424" rx="4" stroke="#C9A961" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

  <!-- Blueprint Header Details -->
  <text x="44" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#0E4B3C">
    FIG 01.0 // ENTERPRISE GROWTH ARCHITECTURE SPECIFICATION
  </text>
  <text x="640" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="1" fill="#5B645F">
    STANDARD: SCM-SYS-2026
  </text>
  <line x1="44" y1="62" x2="756" y2="62" stroke="#0E4B3C" stroke-opacity="0.15" stroke-width="1"/>

  <!-- NODE 1: Demand & Visibility Layer -->
  <g transform="translate(44, 90)" filter="url(#subtleGlow)">
    <rect width="210" height="330" rx="8" fill="url(#cardBgGrad)" stroke="#0E4B3C" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="12" y="12" width="186" height="32" rx="4" fill="#0E4B3C"/>
    <text x="24" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C9A961" letter-spacing="1.5">
      01 / DISCOVERY
    </text>
    
    <!-- Title & Description -->
    <text x="20" y="72" font-family="'Spectral', serif" font-size="16" font-weight="600" fill="#0B0F0D">
      AI &amp; Organic Search
    </text>
    <text x="20" y="92" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#5B645F">
      Dual-engine visibility
    </text>

    <!-- Visual schematic lines -->
    <g transform="translate(20, 115)">
      <!-- AI Engine node -->
      <rect width="170" height="42" rx="4" fill="#F6F7F5" stroke="#C9A961" stroke-width="1"/>
      <circle cx="20" cy="21" r="5" fill="#C9A961"/>
      <text x="34" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0B0F0D">ChatGPT &amp; Perplexity</text>
      <text x="34" y="31" font-family="'Inter', sans-serif" font-size="9" fill="#5B645F">Entity schema &amp; citations</text>

      <!-- Google SERP node -->
      <rect y="54" width="170" height="42" rx="4" fill="#F6F7F5" stroke="#0E4B3C" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="20" cy="75" r="5" fill="#0E4B3C"/>
      <text x="34" y="72" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0B0F0D">Google Search &amp; AIO</text>
      <text x="34" y="85" font-family="'Inter', sans-serif" font-size="9" fill="#5B645F">Local Sydney rank capture</text>
      
      <!-- Metrics badge -->
      <rect y="112" width="170" height="60" rx="4" fill="#082E24"/>
      <text x="14" y="132" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#C9A961" letter-spacing="1">METRIC: CITATION SHARE</text>
      <text x="14" y="152" font-family="'Spectral', serif" font-size="18" font-weight="600" fill="#FFFFFF">+340%</text>
      <text x="80" y="152" font-family="'Inter', sans-serif" font-size="10" fill="#F6F7F5">Qualified Intent</text>
    </g>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <g transform="translate(254, 240)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#C9A961" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="36,0 30,-4 30,4" fill="#C9A961"/>
  </g>

  <!-- NODE 2: Conversion Website Engine -->
  <g transform="translate(295, 80)" filter="url(#subtleGlow)">
    <rect width="210" height="350" rx="8" fill="#FFFFFF" stroke="#0E4B3C" stroke-width="2"/>
    <rect x="12" y="12" width="186" height="32" rx="4" fill="#0E4B3C"/>
    <text x="24" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C9A961" letter-spacing="1.5">
      02 / CONVERSION
    </text>
    
    <!-- Title & Description -->
    <text x="20" y="74" font-family="'Spectral', serif" font-size="16" font-weight="600" fill="#0B0F0D">
      Enquiry Engine
    </text>
    <text x="20" y="94" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#5B645F">
      High-intent buyer flows
    </text>

    <!-- Schema box -->
    <g transform="translate(20, 115)">
      <rect width="170" height="110" rx="6" fill="#F6F7F5" stroke="#0E4B3C" stroke-opacity="0.15" stroke-width="1"/>
      
      <!-- Mini wireframe representation -->
      <rect x="12" y="12" width="70" height="6" rx="2" fill="#0E4B3C"/>
      <rect x="12" y="24" width="146" height="4" rx="2" fill="#5B645F" fill-opacity="0.4"/>
      <rect x="12" y="34" width="120" height="4" rx="2" fill="#5B645F" fill-opacity="0.4"/>
      <rect x="12" y="48" width="50" height="14" rx="3" fill="#C9A961"/>
      
      <line x1="12" y1="72" x2="158" y2="72" stroke="#5B645F" stroke-opacity="0.2"/>
      <text x="12" y="90" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#0E4B3C">Sub-second Speed</text>
      <text x="12" y="102" font-family="'Inter', sans-serif" font-size="8" fill="#5B645F">100% Core Web Vitals</text>

      <!-- Bottom badge -->
      <rect y="122" width="170" height="64" rx="4" fill="#0E4B3C"/>
      <text x="14" y="142" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#C9A961" letter-spacing="1">OUTCOME: FRICTIONLESS</text>
      <text x="14" y="164" font-family="'Spectral', serif" font-size="18" font-weight="600" fill="#FFFFFF">3.8x</text>
      <text x="64" y="164" font-family="'Inter', sans-serif" font-size="10" fill="#F6F7F5">Booking Rate</text>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <g transform="translate(505, 240)">
    <line x1="0" y1="0" x2="41" y2="0" stroke="#C9A961" stroke-width="2" stroke-dasharray="4 2"/>
    <polygon points="41,0 35,-4 35,4" fill="#C9A961"/>
  </g>

  <!-- NODE 3: Enterprise Sales Enablement -->
  <g transform="translate(546, 90)" filter="url(#subtleGlow)">
    <rect width="210" height="330" rx="8" fill="url(#cardBgGrad)" stroke="#0E4B3C" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="12" y="12" width="186" height="32" rx="4" fill="#0E4B3C"/>
    <text x="24" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C9A961" letter-spacing="1.5">
      03 / REVENUE
    </text>
    
    <!-- Title & Description -->
    <text x="20" y="72" font-family="'Spectral', serif" font-size="16" font-weight="600" fill="#0B0F0D">
      Sales Enablement
    </text>
    <text x="20" y="92" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#5B645F">
      Quota-carrying rigor
    </text>

    <!-- Systems list -->
    <g transform="translate(20, 115)">
      <rect width="170" height="42" rx="4" fill="#F6F7F5" stroke="#0E4B3C" stroke-opacity="0.3" stroke-width="1"/>
      <text x="14" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0B0F0D">Sales Playbooks &amp; CRM</text>
      <text x="14" y="32" font-family="'Inter', sans-serif" font-size="9" fill="#5B645F">No deals living in heads</text>

      <rect y="54" width="170" height="42" rx="4" fill="#F6F7F5" stroke="#C9A961" stroke-width="1"/>
      <text x="14" y="73" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0B0F0D">Fixed-Price Proposals</text>
      <text x="14" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#5B645F">48h turnaround standard</text>

      <rect y="112" width="170" height="60" rx="4" fill="#082E24"/>
      <text x="14" y="132" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#C9A961" letter-spacing="1">PIPELINE VELOCITY</text>
      <text x="14" y="152" font-family="'Spectral', serif" font-size="18" font-weight="600" fill="#FFFFFF">100%</text>
      <text x="68" y="152" font-family="'Inter', sans-serif" font-size="10" fill="#F6F7F5">Accountability</text>
    </g>
  </g>
</svg>
