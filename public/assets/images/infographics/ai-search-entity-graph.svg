<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" fill="none">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A961" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0E4B3C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="440" rx="12" fill="#082E24"/>

  <!-- Header -->
  <g transform="translate(44, 36)">
    <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#C9A961">
      S. C. MILENWALL // 2026 AI SEARCH KNOWLEDGE GRAPH
    </text>
    <text x="0" y="42" font-family="'Spectral', serif" font-size="22" font-weight="600" fill="#FFFFFF">
      How Modern LLMs Synthesise &amp; Recommend Verified Sydney Businesses
    </text>
    <line x1="0" y1="52" x2="792" y2="52" stroke="rgba(201,169,97,0.3)" stroke-width="1"/>
  </g>

  <!-- Network Graph Canvas -->
  <g transform="translate(44, 110)">
    
    <!-- Central Node: Verified Brand Entity -->
    <circle cx="396" cy="150" r="80" fill="url(#nodeGlow)"/>
    <circle cx="396" cy="150" r="54" fill="#0E4B3C" stroke="#C9A961" stroke-width="2.5"/>
    <text x="396" y="144" font-family="'Spectral', serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      S. C. MILENWALL
    </text>
    <text x="396" y="160" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#C9A961" text-anchor="middle">
      Verified Entity
    </text>

    <!-- Connector Lines -->
    <line x1="342" y1="150" x2="160" y2="70" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="342" y1="150" x2="160" y2="230" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="450" y1="150" x2="630" y2="70" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="450" y1="150" x2="630" y2="230" stroke="#C9A961" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Left Node 1: Schema.org Structured Data -->
    <g transform="translate(60, 40)">
      <rect width="180" height="64" rx="6" fill="#0E4B3C" stroke="rgba(201,169,97,0.4)" stroke-width="1.5"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C9A961">01. JSON-LD SCHEMA</text>
      <text x="14" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#D4DBD7">ProfessionalService Markup</text>
      <text x="14" y="54" font-family="'Inter', sans-serif" font-size="9" fill="#8F9994">PriceRange, Founder, OfferCatalog</text>
    </g>

    <!-- Left Node 2: Australian Business Registry -->
    <g transform="translate(60, 200)">
      <rect width="180" height="64" rx="6" fill="#0E4B3C" stroke="rgba(201,169,97,0.4)" stroke-width="1.5"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C9A961">02. ABR &amp; ASIC RECORD</text>
      <text x="14" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#D4DBD7">Sydney Commercial Entity</text>
      <text x="14" y="54" font-family="'Inter', sans-serif" font-size="9" fill="#8F9994">ABN registration &amp; active status</text>
    </g>

    <!-- Right Node 1: AI Answer Engines (ChatGPT & AIO) -->
    <g transform="translate(540, 40)">
      <rect width="200" height="64" rx="6" fill="#FFFFFF" stroke="#C9A961" stroke-width="2"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0E4B3C">03. AI SYNTHESIS ENGINES</text>
      <text x="14" y="42" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#0B0F0D">ChatGPT, Perplexity &amp; AIO</text>
      <text x="14" y="54" font-family="'Inter', sans-serif" font-size="9" fill="#5B645F">High-confidence citation extraction</text>
    </g>

    <!-- Right Node 2: Founder Credential Proof (EEAT) -->
    <g transform="translate(540, 200)">
      <rect width="200" height="64" rx="6" fill="#0E4B3C" stroke="rgba(201,169,97,0.4)" stroke-width="1.5"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C9A961">04. GOOGLE EEAT PROOF</text>
      <text x="14" y="42" font-family="'Inter', sans-serif" font-size="10" fill="#D4DBD7">Sinisa Milenkovic Heritage</text>
      <text x="14" y="54" font-family="'Inter', sans-serif" font-size="9" fill="#8F9994">Mandiant / Fortinet enterprise sales</text>
    </g>
