<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" fill="none">
  <defs>
    <pattern id="gridAgency" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0E4B3C" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="880" height="440" rx="12" fill="#F6F7F5"/>
  <rect width="880" height="440" rx="12" fill="url(#gridAgency)"/>
  <rect x="14" y="14" width="852" height="412" rx="8" stroke="#0E4B3C" stroke-opacity="0.2" stroke-width="1" fill="none"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#0E4B3C">
      S. C. MILENWALL // PROCUREMENT &amp; GOVERNANCE MATRIX
    </text>
    <text x="0" y="42" font-family="'Spectral', serif" font-size="22" font-weight="600" fill="#0B0F0D">
      Fixed-Price Honesty vs The Traditional Billable Agency Model
    </text>
    <line x1="0" y1="52" x2="800" y2="52" stroke="#0E4B3C" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Side-by-Side Comparison Container -->
  <g transform="translate(40, 110)">
    
    <!-- LEFT: SCM Fixed-Price Model -->
    <g transform="translate(0, 0)">
      <rect width="388" height="290" rx="8" fill="#FFFFFF" stroke="#0E4B3C" stroke-width="2"/>
      <rect width="388" height="42" rx="8 8 0 0" fill="#0E4B3C"/>
      <text x="18" y="26" font-family="'Spectral', serif" font-size="16" font-weight="600" fill="#FFFFFF">
        S. C. Milenwall (Fixed-Price Honesty)
      </text>
      <text x="310" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C9A961">
        THE STANDARD
      </text>

      <!-- Row 1: Cost Risk -->
      <g transform="translate(18, 56)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0E4B3C">1. COST RISK &amp; INVOICING</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#27312C">Stated upfront before start. 100% price guarantee. Zero hourly invoices.</text>
      </g>

      <!-- Row 2: Accountability -->
      <g transform="translate(18, 102)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0E4B3C">2. ACCOUNTABILITY &amp; CONTACT</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#27312C">Single point of contact. Sinisa scopes and delivers directly. No junior handoff.</text>
      </g>

      <!-- Row 3: Incentive Alignment -->
      <g transform="translate(18, 148)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0E4B3C">3. INCENTIVE ALIGNMENT</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#27312C">Incentivised to deliver working systems rapidly and cleanly to protect margin.</text>
      </g>

      <!-- Row 4: Asset Ownership -->
      <g transform="translate(18, 194)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0E4B3C">4. IP &amp; ASSET OWNERSHIP</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#27312C">100% full transfer of all code, copy, and playbooks upon final settlement.</text>
      </g>

      <!-- Bottom Badge -->
      <g transform="translate(18, 240)">
        <rect width="352" height="34" rx="4" fill="#EDF7F2" stroke="#0E4B3C" stroke-opacity="0.3" stroke-width="1"/>
        <text x="14" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0E4B3C">
          ✓ Commercial Certainty: Predictable ROI for Directors &amp; Owners
        </text>
      </g>
    </g>

    <!-- RIGHT: Traditional Agency Model -->
    <g transform="translate(412, 0)">
      <rect width="388" height="290" rx="8" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
      <rect width="388" height="42" rx="8 8 0 0" fill="#4A5568"/>
      <text x="18" y="26" font-family="'Spectral', serif" font-size="16" font-weight="600" fill="#FFFFFF">
        Traditional Agency (Billable Hours)
      </text>
      <text x="300" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FEB2B2">
        HIGH FRICTION
      </text>

      <!-- Row 1: Cost Risk -->
      <g transform="translate(18, 56)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#742A2A">1. COST RISK &amp; INVOICING</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#718096">Hourly rates ($180–$250/hr). Regular monthly blowouts and scope creep.</text>
      </g>

      <!-- Row 2: Accountability -->
      <g transform="translate(18, 102)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#742A2A">2. ACCOUNTABILITY &amp; CONTACT</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#718096">Pitched by senior partner, then handed off to junior account coordinator.</text>
      </g>

      <!-- Row 3: Incentive Alignment -->
      <g transform="translate(18, 148)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#742A2A">3. INCENTIVE ALIGNMENT</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#718096">Incentivised to stretch project duration and log billable hours for meetings.</text>
      </g>

      <!-- Row 4: Asset Ownership -->
      <g transform="translate(18, 194)">
        <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#742A2A">4. IP &amp; ASSET OWNERSHIP</text>
        <text x="0" y="30" font-family="'Inter', sans-serif" font-size="11" fill="#718096">Proprietary vendor lock-in or ongoing platform hosting retainer fees.</text>
      </g>

      <!-- Bottom Badge -->
      <g transform="translate(18, 240)">
        <rect width="352" height="34" rx="4" fill="#FFF5F5" stroke="#E53E3E" stroke-opacity="0.3" stroke-width="1"/>
        <text x="14" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C53030">
          ✕ Budget Uncertainty: Frequent Scope Change Orders
        </text>
      </g>
    </g>
  </g>
</svg>
